name: Consolidar noticias

on:

  # ==========================================================
  # EJECUTAR CUANDO APAREZCA O CAMBIE UN PARQUET
  # ==========================================================

  push:
    paths:
      - 'noticias/piura/parquet/*.parquet'
      - 'noticias/lambayeque/parquet/*.parquet'

  # Ejecución manual
  workflow_dispatch:


# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: write


# ============================================================
# JOB
# ============================================================

jobs:

  consolidar:

    name: Consolidar Parquet
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. DESCARGAR REPOSITORIO
      # ======================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. CONFIGURAR PYTHON
      # ======================================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. INSTALAR DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias
        run: |

          python -m pip install --upgrade pip

          pip install pandas pyarrow


      # ======================================================
      # 4. MOSTRAR PARQUETS DISPONIBLES
      # ======================================================

      - name: Revisar Parquet
        run: |

          echo "=========================================="
          echo "PARQUETS DE PIURA"
          echo "=========================================="

          if [ -d "noticias/piura/parquet" ]; then

            find noticias/piura/parquet \
              -type f \
              -name "*.parquet" \
              -print

          else

            echo "⚠ No existe la carpeta de Piura."

          fi


          echo ""
          echo "=========================================="
          echo "PARQUETS DE LAMBAYEQUE"
          echo "=========================================="

          if [ -d "noticias/lambayeque/parquet" ]; then

            find noticias/lambayeque/parquet \
              -type f \
              -name "*.parquet" \
              -print

          else

            echo "⚠ No existe la carpeta de Lambayeque."

          fi


      # ======================================================
      # 5. EJECUTAR JOINNEWS PAPER
      # ======================================================

      - name: Ejecutar JoinNewsPaper
        run: |

          echo "=========================================="
          echo "CONSOLIDANDO NOTICIAS"
          echo "=========================================="

          python JoinNewsPaper.py


      # ======================================================
      # 6. REVISAR CONSOLIDADOS
      # ======================================================

      - name: Revisar archivos consolidados
        run: |

          echo "=========================================="
          echo "ARCHIVOS CONSOLIDADOS"
          echo "=========================================="


          echo ""
          echo "PIURA:"
          
          if [ -f "noticias/noticias_piura.parquet" ]; then

            ls -lh \
              noticias/noticias_piura.parquet

          else

            echo "⚠ No existe consolidado de Piura."

          fi


          echo ""
          echo "LAMBAYEQUE:"

          if [ -f "noticias/noticias_lambayeque.parquet" ]; then

            ls -lh \
              noticias/noticias_lambayeque.parquet

          else

            echo "⚠ No existe consolidado de Lambayeque."

          fi


      # ======================================================
      # 7. CONFIGURAR GIT
      # ======================================================

      - name: Configurar Git
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ======================================================
      # 8. REVISAR CAMBIOS
      # ======================================================

      - name: Revisar cambios
        run: |

          echo "=========================================="
          echo "CAMBIOS QUE SERÁN GUARDADOS"
          echo "=========================================="

          git status --short


      # ======================================================
      # 9. GUARDAR CONSOLIDADOS
      # ======================================================

      - name: Guardar consolidados
        run: |

          echo "=========================================="
          echo "GUARDANDO CAMBIOS"
          echo "=========================================="


          git add \
            noticias/noticias_piura.parquet


          git add \
            noticias/noticias_lambayeque.parquet


          echo ""
          echo "Cambios que serán guardados:"

          git diff --cached --stat


          if git diff --cached --quiet; then

            echo ""
            echo "No hay cambios para guardar."

          else

            git commit \
              -m "Actualizar y consolidar noticias"

            echo ""
            echo "Commit creado correctamente."


            # ==================================================
            # PUSH USANDO GITHUB_TOKEN
            # ==================================================

            git push origin HEAD:main

            echo ""
            echo "=========================================="
            echo "✓ CONSOLIDADOS ACTUALIZADOS"
            echo "=========================================="

          fi
